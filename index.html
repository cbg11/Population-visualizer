<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diamond Hierarchy Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { background: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        .node { cursor: default; user-select: none; }
        .node rect.card-bg {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            rx: 10px;
            ry: 10px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.06));
        }
        .node:hover rect.card-bg {
            stroke: #6366f1;
            stroke-width: 2px;
            filter: drop-shadow(0 10px 15px rgba(99,102,241,0.2));
        }

        .link { fill: none; stroke: #94a3b8; stroke-width: 2; transition: stroke 0.25s; }
        .link-sampled { stroke: #10b981 !important; stroke-width: 2px; stroke-dasharray: 5 5; }

        /* Woreda Table */
        .node-table { border-collapse: collapse; font-size: 10px; width: 100%; }
        .node-table th {
            background-color: #334155; color: #f8fafc; font-weight: 600;
            padding: 6px 8px; text-align: left; letter-spacing: 0.02em;
        }
        .node-table td {
            padding: 6px 8px; border-bottom: 1px solid #e2e8f0;
            color: #1e293b; white-space: nowrap;
        }
        .node-table tr:nth-child(even) { background-color: #f8fafc; }
        .node-table tr:hover { background-color: #f1f5f9; }
        .node-table tr.sampled-row { background-color: #cceede; font-weight: 600; }
        .node-table tr.sampled-row:hover { background-color: #a4dcbf; }
        .node-table tr.totals-row { background-color: #e2e8f0; font-weight: 700; border-top: 2px solid #94a3b8; }

        /* Kebele Table */
        .kebele-table { border-collapse: collapse; font-size: 9.5px; width: 100%; margin-top: 6px; }
        .kebele-table th {
            background-color: #047857; color: #ffffff; font-weight: 600;
            padding: 5px 8px; text-align: left;
        }
        .kebele-table td {
            padding: 5px 8px; border-bottom: 1px solid #d1fae5;
            color: #064e3b; white-space: nowrap;
        }
        .kebele-table tr:nth-child(even) { background-color: #f0fdf4; }
        .kebele-table tr:hover { background-color: #d1fae5; }
        .kebele-table tr.totals-row { background-color: #a7f3d0; font-weight: 700; border-top: 2px solid #059669; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

<header class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white px-8 py-4 flex items-center justify-between shadow-lg">
    <div>
        <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
            Region <span class="text-indigo-400">→</span> Zone <span class="text-indigo-400">→</span> Mining <span class="text-indigo-400">→</span> Woredas <span class="text-indigo-400">→</span> Leaves <span class="text-indigo-400">→</span> Totals
        </h1>
        <p class="text-xs text-slate-300 mt-0.5">Fixed diamond hierarchy — totals sit directly beneath the deepest leaves, converging upward.</p>
    </div>
    <div class="flex gap-3 items-center">
        <button id="resetZoom" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium px-3.5 py-2 rounded-lg border border-slate-700 transition duration-200">Reset View</button>
    </div>
</header>

<main class="flex-1 relative flex flex-col p-5">
    <div id="treeContainer" class="w-full flex-1 bg-white rounded-2xl border border-slate-200 shadow-sm relative overflow-hidden" style="min-height: 78vh;">
        <div id="placeholder" class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div class="text-center p-8 border-2 border-dashed border-slate-300 rounded-3xl bg-slate-50/50 max-w-sm backdrop-blur-sm">
                <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-indigo-100">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                </div>
                <h3 class="text-base font-bold text-slate-800">Loading population dataset…</h3>
                <p class="text-xs text-slate-500 mt-1">Reading population.xlsx from this website folder.</p>
            </div>
        </div>
    </div>
</main>

<script>
    let svg, g, zoom, root, i = 0;
    const duration = 350;

    // ---------- helpers ----------
    function formatNumber(num) {
        if (num === undefined || num === null || num === '' || isNaN(num)) return num || '—';
        return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    }
    function toNumber(val) {
        if (!val || isNaN(val)) return 0;
        return Number(val);
    }
    function isValueValid(val) {
        if (val === undefined || val === null) return false;
        const str = String(val).trim().toLowerCase();
        return str !== '' && str !== 'null' && str !== 'none' && str !== 'nan';
    }

    const DATASET_URL = './population.xlsx';

    document.getElementById('resetZoom').addEventListener('click', () => {
        if (svg && zoom) svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
    });

    async function loadDefaultDataset() {
        const placeholder = document.getElementById('placeholder');
        try {
            const response = await fetch(DATASET_URL, { cache: 'no-store' });
            if (!response.ok) throw new Error(`Could not load ${DATASET_URL} (HTTP ${response.status}).`);
            const buffer = await response.arrayBuffer();
            const workbook = XLSX.read(buffer, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });
            if (!rows.length) throw new Error('The Excel file contains no data rows.');
            processData(rows);
        } catch (error) {
            console.error('Automatic dataset loading failed:', error);
            const message = placeholder.querySelector('p');
            if (message) {
                message.textContent =
                    `Could not automatically load population.xlsx. ${error.message} ` +
                    'Make sure population.xlsx is beside index.html, the filename matches exactly, and open the page through HTTP/HTTPS.';
            }
        }
    }

    loadDefaultDataset();

    // ---------- data processing ----------
    function processData(rows) {
        if (!rows || rows.length === 0) return;

        const regionMap = {};

        rows.forEach(row => {
            const region = row['Region'] || 'Unknown Region';
            const zone = row['Zone'] || 'Unknown Zone';
            const mining = (row['Mining'] && String(row['Mining']).trim()) ? String(row['Mining']).trim() : 'Unknown Mining';
            const woreda = row['Woreda'] || 'Unknown Woreda';

            if (!regionMap[region]) regionMap[region] = {};
            if (!regionMap[region][zone]) regionMap[region][zone] = {};
            if (!regionMap[region][zone][mining]) regionMap[region][zone][mining] = {};

            const isSampled = isValueValid(row['Sampled Kebele']) || isValueValid(row['List of Seelcted Kebeles']) || isValueValid(row['List of Sampled Kebeles']);

            if (!regionMap[region][zone][mining][woreda]) {
                regionMap[region][zone][mining][woreda] = {
                    woreda: woreda,
                    mining: mining,
                    sd: row['SD'],
                    diversity: row['Diversity'],
                    totalKebele: toNumber(row['Total Kebele']),
                    population: toNumber(row['Population']),
                    totalU5: toNumber(row['Total U5']),
                    sampledKebele: toNumber(row['Sampled Kebele']),
                    isSampled: false,
                    sampledDetails: []
                };
            }

            if (isSampled) {
                regionMap[region][zone][mining][woreda].isSampled = true;
                regionMap[region][zone][mining][woreda].sampledDetails.push({
                    listOfKebeles: row['List of Sampled Kebeles'] || row['List of Seelcted Kebeles'],
                    kebeleU5: toNumber(row['Kebele U5']),
                    sampleSize: toNumber(row['Sample Size'])
                });
            }
        });

        const regionKeys = Object.keys(regionMap);

        const buildMiningNode = (mName, mWoredas, zName) => {
            const woredaList = Object.values(mWoredas);
            const sampledChildren = [];

            const totalWoredas = woredaList.length;
            const selectedWoredas = woredaList.filter(w => w.isSampled).length;
            const totalKebeles = woredaList.reduce((acc, w) => acc + w.totalKebele, 0);
            const selectedKebeles = woredaList.reduce((acc, w) => acc + w.sampledKebele, 0);

            let miningSampleSize = 0;

            woredaList.forEach(wRecord => {
                if (wRecord.isSampled && wRecord.sampledDetails.length > 0) {
                    const leafSampleSize = wRecord.sampledDetails.reduce((acc, d) => acc + d.sampleSize, 0);
                    miningSampleSize += leafSampleSize;
                    sampledChildren.push({
                        name: wRecord.woreda,
                        type: 'sampled-leaf',
                        items: wRecord.sampledDetails,
                        sampleSize: leafSampleSize
                    });
                }
            });

            const summary = {
                totalWoredas,
                selectedWoredas,
                totalKebeles,
                selectedKebeles,
                totalSampleSize: miningSampleSize
            };

            const tableNode = {
                name: `Woredas List (${zName} - ${mName})`,
                type: 'woreda-table-node',
                rows: woredaList,
                sampleSize: miningSampleSize,
                children: sampledChildren.length > 0 ? sampledChildren : null
            };

            return {
                name: mName,
                type: 'mining',
                summary,
                children: [tableNode]
            };
        };

        const buildZoneNode = (zName, zMinings) => {
            const miningKeys = Object.keys(zMinings);
            const miningNodes = miningKeys.map(mName => buildMiningNode(mName, zMinings[mName], zName));

            let totalWoredas = 0, selectedWoredas = 0, totalKebeles = 0, selectedKebeles = 0, zoneSampleSize = 0;
            miningNodes.forEach(m => {
                totalWoredas += m.summary.totalWoredas;
                selectedWoredas += m.summary.selectedWoredas;
                totalKebeles += m.summary.totalKebeles;
                selectedKebeles += m.summary.selectedKebeles;
                zoneSampleSize += m.summary.totalSampleSize;
            });

            return {
                name: zName,
                type: 'zone',
                summary: { totalWoredas, selectedWoredas, totalKebeles, selectedKebeles, totalSampleSize: zoneSampleSize },
                children: miningNodes
            };
        };

        const buildRegionNode = (rName) => {
            const zones = Object.keys(regionMap[rName]).map(
                zName => buildZoneNode(zName, regionMap[rName][zName])
            );

            let totalWoredas = 0, selectedWoredas = 0, totalKebeles = 0, selectedKebeles = 0, totalSampleSize = 0;
            zones.forEach(z => {
                totalWoredas += z.summary.totalWoredas;
                selectedWoredas += z.summary.selectedWoredas;
                totalKebeles += z.summary.totalKebeles;
                selectedKebeles += z.summary.selectedKebeles;
                totalSampleSize += z.summary.totalSampleSize;
            });

            return {
                name: rName,
                type: 'region',
                summary: { totalWoredas, selectedWoredas, totalKebeles, selectedKebeles, totalSampleSize },
                children: zones
            };
        };

        const regionNodes = regionKeys.map(buildRegionNode);

        const rootData = {
            name: 'Root',
            type: 'invisible-root',
            children: regionNodes
        };

        document.getElementById('placeholder').style.display = 'none';
        renderTree(rootData);
    }

    // ---------- sizes ----------
    function getNodeSize(d) {
        if (d.data.type === 'invisible-root') return { width: 0, height: 0 };
        if (d.data.type === 'woreda-table-node') {
            const rowCount = d.data.rows.length + 1;
            const width = 800;
            const height = 50 + (rowCount * 28);
            return { width, height };
        }
        if (d.data.type === 'sampled-leaf') {
            const itemCount = d.data.items.length + 1;
            const width = 310;
            const height = 65 + (itemCount * 28);
            return { width, height };
        }
        // Simplified parent cards (name-only)
        if (d.data.type === 'mining') return { width: 220, height: 60 };
        if (d.data.type === 'zone') return { width: 260, height: 65 };
        if (d.data.type === 'region') return { width: 320, height: 75 };
        if (d.data.type === 'total') return { width: 320, height: 110 };
        return { width: 240, height: 60 };
    }

    // ---------- tree render ----------
    function renderTree(data) {
        d3.select("#treeContainer").select("svg").remove();

        const container = document.getElementById('treeContainer');
        const width = container.clientWidth || 1000;
        const height = container.clientHeight || 780;

        zoom = d3.zoom().scaleExtent([0.08, 3]).on('zoom', (e) => g.attr('transform', e.transform));

        svg = d3.select("#treeContainer")
            .append("svg")
            .attr("width", width)
            .attr("height", height)
            .call(zoom)
            .append("g");

        g = svg.append("g").attr("transform", `translate(${width / 2}, 60)`);

        root = d3.hierarchy(data, d => d.children);
        root.x0 = 0;
        root.y0 = 0;

        update(root);
    }

    // ---------- render a node's content ----------
    function renderNodeContent(group, d) {
        const { width: cardWidth, height: cardHeight } = getNodeSize(d);

        let headerBg = '#4f46e5', cardBg = '#ffffff';
        if (d.data.type === 'region') headerBg = '#4338ca';
        if (d.data.type === 'zone') headerBg = '#0284c7';
        if (d.data.type === 'mining') headerBg = '#d97706';
        if (d.data.type === 'woreda-table-node') headerBg = '#334155';
        if (d.data.type === 'total') { headerBg = '#059669'; cardBg = '#f0fdf4'; }
        if (d.data.type === 'sampled-leaf') { headerBg = '#10b981'; cardBg = '#f0fdf4'; }

        // Card BG
        group.append('rect')
            .attr('class', 'card-bg')
            .attr('x', -cardWidth / 2)
            .attr('y', 0)
            .attr('width', cardWidth)
            .attr('height', cardHeight)
            .attr('fill', cardBg)
            .attr('stroke', '#cbd5e1')
            .attr('stroke-width', 1);

        // Colored header line
        group.append('rect')
            .attr('x', -cardWidth / 2)
            .attr('y', 0)
            .attr('width', cardWidth)
            .attr('height', 5)
            .attr('rx', 2)
            .attr('fill', headerBg);

        // ----- Region: name only -----
        if (d.data.type === 'region') {
            const fo = group.append('foreignObject')
                .attr('x', -cardWidth / 2)
                .attr('y', 5)
                .attr('width', cardWidth)
                .attr('height', cardHeight - 5);
            fo.append('xhtml:div')
                .style('width', '100%').style('height', '100%')
                .style('display', 'flex')
                .style('align-items', 'center')
                .style('justify-content', 'center')
                .style('padding', '0 12px')
                .html(`<div class="font-bold text-lg text-slate-800 text-center leading-tight">${d.data.name}</div>`);
        }
        // ----- Zone: name only -----
        else if (d.data.type === 'zone') {
            const fo = group.append('foreignObject')
                .attr('x', -cardWidth / 2)
                .attr('y', 5)
                .attr('width', cardWidth)
                .attr('height', cardHeight - 5);
            fo.append('xhtml:div')
                .style('width', '100%').style('height', '100%')
                .style('display', 'flex')
                .style('align-items', 'center')
                .style('justify-content', 'center')
                .style('padding', '0 12px')
                .html(`<div class="font-bold text-base text-slate-800 text-center leading-tight">${d.data.name}</div>`);
        }
        // ----- Mining: name only -----
        else if (d.data.type === 'mining') {
            const fo = group.append('foreignObject')
                .attr('x', -cardWidth / 2)
                .attr('y', 5)
                .attr('width', cardWidth)
                .attr('height', cardHeight - 5);
            fo.append('xhtml:div')
                .style('width', '100%').style('height', '100%')
                .style('display', 'flex')
                .style('align-items', 'center')
                .style('justify-content', 'center')
                .style('padding', '0 12px')
                .html(`<div class="font-bold text-sm text-amber-900 uppercase tracking-wide text-center leading-tight">${d.data.name}</div>`);
        }
        // ----- Totals: full summary -----
        else if (d.data.type === 'total') {
            const fo = group.append('foreignObject')
                .attr('x', -cardWidth / 2)
                .attr('y', 5)
                .attr('width', cardWidth)
                .attr('height', cardHeight - 5);
            const s = d.data.summary;
            fo.append('xhtml:div')
                .style('width', '100%').style('height', '100%')
                .style('padding', '9px 12px').style('text-align', 'center')
                .html(`
                    <div class="font-bold text-sm text-emerald-900">${d.data.name}</div>
                    <div class="grid grid-cols-2 gap-1.5 mt-1.5 text-[9.5px]">
                        <div class="bg-indigo-50 border border-indigo-200 rounded py-1 px-1.5 text-indigo-900">
                            <strong>Woredas</strong><br>${formatNumber(s.selectedWoredas)} / ${formatNumber(s.totalWoredas)}
                        </div>
                        <div class="bg-emerald-50 border border-emerald-200 rounded py-1 px-1.5 text-emerald-900">
                            <strong>Kebeles</strong><br>${formatNumber(s.selectedKebeles)} / ${formatNumber(s.totalKebeles)}
                        </div>
                    </div>
                    <div class="mt-1.5 bg-emerald-600 text-white rounded py-1 px-2 text-[10.5px] font-bold shadow-sm">
                        TOTAL SAMPLE SIZE: ${formatNumber(s.totalSampleSize)}
                    </div>
                `);
        }
        // ----- Woreda table -----
        else if (d.data.type === 'woreda-table-node') {
            const fo = group.append('foreignObject')
                .attr('x', -cardWidth / 2)
                .attr('y', 5)
                .attr('width', cardWidth)
                .attr('height', cardHeight - 5);
            const div = fo.append('xhtml:div')
                .style('width', '100%').style('height', '100%')
                .style('overflow', 'hidden').style('padding', '10px 12px');

            let tableHtml = `
                <table class="node-table">
                    <thead>
                        <tr>
                            <th style="width: 28px; text-align: center;">#</th>
                            <th>Woreda</th>
                            <th>Mining Status</th>
                            <th>SD</th>
                            <th>Diversity</th>
                            <th>Kebele</th>
                            <th>Population</th>
                            <th>Total U5</th>
                            <th>Selected Kebele</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            let totKebele = 0, totPop = 0, totU5 = 0, totSelectedKebele = 0;

            d.data.rows.forEach((r, idx) => {
                totKebele += toNumber(r.totalKebele);
                totPop += toNumber(r.population);
                totU5 += toNumber(r.totalU5);
                totSelectedKebele += toNumber(r.sampledKebele);

                const rowClass = r.isSampled ? 'sampled-row' : '';
                tableHtml += `
                    <tr class="${rowClass}">
                        <td style="text-align: center; color: #64748b; font-weight: 600;">${idx + 1}</td>
                        <td>${r.woreda} ${r.isSampled ? '<span style="color:#10b981">★</span>' : ''}</td>
                        <td>${r.mining || '—'}</td>
                        <td>${r.sd || '—'}</td>
                        <td>${r.diversity || '—'}</td>
                        <td>${formatNumber(r.totalKebele)}</td>
                        <td>${formatNumber(r.population)}</td>
                        <td>${formatNumber(r.totalU5)}</td>
                        <td>${formatNumber(r.sampledKebele)}</td>
                    </tr>
                `;
            });

            tableHtml += `
                <tr class="totals-row">
                    <td style="text-align: center;">-</td>
                    <td colspan="4">Total (${d.data.rows.length} Woredas) — <span style="color:#047857; font-weight:800;">Sample Size Total: ${formatNumber(d.data.sampleSize)}</span></td>
                    <td>${formatNumber(totKebele)}</td>
                    <td>${formatNumber(totPop)}</td>
                    <td>${formatNumber(totU5)}</td>
                    <td>${formatNumber(totSelectedKebele)}</td>
                </tr>
            `;

            tableHtml += `</tbody></table>`;
            div.html(tableHtml);
        }
        // ----- Sampled leaf -----
        else if (d.data.type === 'sampled-leaf') {
            const fo = group.append('foreignObject')
                .attr('x', -cardWidth / 2)
                .attr('y', 5)
                .attr('width', cardWidth)
                .attr('height', cardHeight - 5);
            const div = fo.append('xhtml:div')
                .style('width', '100%').style('height', '100%')
                .style('padding', '8px 10px').style('overflow', 'visible');

            let totalU5 = 0, totalSample = 0;

            let kebeleHtml = `
                <div class="text-center font-bold text-emerald-900 text-xs mb-1 tracking-tight flex items-center justify-center gap-1.5">
                    <span>${d.data.name}</span>
                    <span class="text-[9px] bg-emerald-200 text-emerald-800 px-1.5 py-0.5 rounded-full font-semibold">Randomly Selected</span>
                </div>
                <table class="kebele-table">
                    <thead>
                        <tr>
                            <th style="width: 24px; text-align: center;">#</th>
                            <th>List of Kebeles</th>
                            <th>Kebele U5</th>
                            <th>Sample</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            d.data.items.forEach((item, idx) => {
                totalU5 += toNumber(item.kebeleU5);
                totalSample += toNumber(item.sampleSize);
                kebeleHtml += `
                    <tr>
                        <td style="text-align: center; color: #047857; font-weight: 600;">${idx + 1}</td>
                        <td class="font-medium">${item.listOfKebeles || '—'}</td>
                        <td>${formatNumber(item.kebeleU5)}</td>
                        <td class="font-semibold text-emerald-700">${formatNumber(item.sampleSize)}</td>
                    </tr>
                `;
            });

            kebeleHtml += `
                <tr class="totals-row">
                    <td style="text-align: center;">-</td>
                    <td>Total (${d.data.items.length})</td>
                    <td>${formatNumber(totalU5)}</td>
                    <td class="text-emerald-900 font-extrabold">${formatNumber(totalSample)}</td>
                </tr>
            `;

            kebeleHtml += `</tbody></table>`;
            div.html(kebeleHtml);
        }
    }

    // ---------- update / layout ----------
    function update(source) {
        // ===== 1. Tree layout (X positions) =====
        const treeLayout = d3.tree()
            .nodeSize([400, 1])
            .separation((a, b) => {
                const aW = getNodeSize(a).width;
                const bW = getNodeSize(b).width;
                const minSep = (aW + bW) / 2 + 70;
                return Math.max(1, minSep / 400);
            });

        const treeData = treeLayout(root);
        const allTreeNodes = treeData.descendants();
        const allTreeLinks = treeData.links();

        const nodes = allTreeNodes.filter(d => d.data.type !== 'invisible-root');
        const links = allTreeLinks.filter(d => d.source.data.type !== 'invisible-root');

        // ===== 2. Y positions by depth (increased vertical gap = 200) =====
        const VERTICAL_GAP = 200;
        const levels = d3.group(nodes, d => d.depth);
        let cumulativeY = 0;
        const depthYMap = new Map();
        Array.from(levels.keys()).sort((a, b) => a - b).forEach(depth => {
            depthYMap.set(depth, cumulativeY);
            const levelNodes = levels.get(depth);
            if (levelNodes && levelNodes.length) {
                const maxH = d3.max(levelNodes, d => getNodeSize(d).height);
                cumulativeY += maxH + VERTICAL_GAP;
            }
        });

        nodes.forEach(d => { d.y = depthYMap.get(d.depth); });

        // ===== 3. Find deepest leaves =====
        function getDeepestLeaves(node) {
            if (!node.children || node.children.length === 0) return [node];
            let result = [];
            node.children.forEach(c => {
                result = result.concat(getDeepestLeaves(c));
            });
            return result;
        }

        const deepestLeaves = [];
        nodes.forEach(d => {
            if (!d.children || d.children.length === 0) deepestLeaves.push(d);
        });

        const leafBottom = deepestLeaves.length
            ? d3.max(deepestLeaves, d => d.y + getNodeSize(d).height)
            : 0;

        // ===== 4. Build overlay total nodes (with more spacing) =====
        const miningNodes = nodes.filter(d => d.data.type === 'mining');
        const zoneNodes = nodes.filter(d => d.data.type === 'zone');
        const regionNodes = nodes.filter(d => d.data.type === 'region');

        function isDescendantOf(node, ancestor) {
            let p = node.parent;
            while (p) {
                if (p === ancestor) return true;
                p = p.parent;
            }
            return false;
        }

        // Mining totals — beneath the deepest leaves of each mining.
        const miningTotalY = leafBottom + 200;
        const miningTotalNodes = miningNodes.map(m => {
            const leaves = getDeepestLeaves(m);
            const x = leaves.length ? d3.mean(leaves, d => d.x) : m.x;
            return {
                id: 'mt-' + m.id,
                x: x,
                y: miningTotalY,
                parentMining: m,
                isOverlay: true,
                leafSources: leaves,
                data: {
                    name: `${m.data.name} Total`,
                    type: 'total',
                    summary: m.data.summary
                }
            };
        });

        // Zone totals — beneath mining totals.
        const zoneTotalY = miningTotalY + 220;
        const zoneTotalNodes = zoneNodes.map(z => {
            const childMiningTotals = miningTotalNodes.filter(mt => isDescendantOf(mt.parentMining, z));
            const x = childMiningTotals.length ? d3.mean(childMiningTotals, d => d.x) : z.x;
            return {
                id: 'zt-' + z.id,
                x: x,
                y: zoneTotalY,
                parentZone: z,
                isOverlay: true,
                childMiningTotals: childMiningTotals,
                data: {
                    name: `${z.data.name} Total`,
                    type: 'total',
                    summary: z.data.summary
                }
            };
        });

        // Region totals — beneath zone totals.
        const regionTotalY = zoneTotalY + 240;
        const regionTotalNodes = regionNodes.map(r => {
            const childZoneTotals = zoneTotalNodes.filter(zt => isDescendantOf(zt.parentZone, r));
            const x = childZoneTotals.length ? d3.mean(childZoneTotals, d => d.x) : r.x;
            return {
                id: 'rt-' + r.id,
                x: x,
                y: regionTotalY,
                parentRegion: r,
                isOverlay: true,
                childZoneTotals: childZoneTotals,
                data: {
                    name: `${r.data.name} Total`,
                    type: 'total',
                    summary: r.data.summary
                }
            };
        });

        const allOverlayNodes = [...miningTotalNodes, ...zoneTotalNodes, ...regionTotalNodes];
        const allNodes = [...nodes, ...allOverlayNodes];

        // ===== 5. Render nodes =====
        const node = g.selectAll('g.node')
            .data(allNodes, d => d.id || (d.id = ++i));

        const nodeEnter = node.enter().append('g')
            .attr('class', 'node')
            .attr('transform', d => `translate(${source.x0 ?? source.x ?? 0},${source.y0 ?? source.y ?? 0})`);

        nodeEnter.each(function (d) {
            renderNodeContent(d3.select(this), d);
        });

        const nodeUpdate = nodeEnter.merge(node);
        nodeUpdate.transition().duration(duration)
            .attr('transform', d => `translate(${d.x},${d.y})`);

        node.exit().transition().duration(duration)
            .attr('transform', d => `translate(${source.x},${source.y})`)
            .style('opacity', 0)
            .remove();

        // ===== 6. Main tree links =====
        const link = g.selectAll('path.link')
            .data(links, d => d.target.id);

        const linkEnter = link.enter().insert('path', 'g.node')
            .attr('class', 'link')
            .attr('d', d => {
                const o = { x: source.x0 ?? 0, y: source.y0 ?? 0 };
                return `M ${o.x} ${o.y} C ${o.x} ${o.y}, ${o.x} ${o.y}, ${o.x} ${o.y}`;
            });

        linkEnter.merge(link).transition().duration(duration)
            .attr('d', d => {
                const sourceH = getNodeSize(d.source).height;
                const sx = d.source.x, sy = d.source.y + sourceH;
                const tx = d.target.x, ty = d.target.y;
                return `M ${sx} ${sy} C ${sx} ${(sy + ty) / 2}, ${tx} ${(sy + ty) / 2}, ${tx} ${ty}`;
            })
            .attr('class', d => d.target.data.type === 'sampled-leaf' ? 'link link-sampled' : 'link');

        link.exit().transition().duration(duration)
            .attr('d', d => {
                const o = { x: source.x, y: source.y };
                return `M ${o.x} ${o.y} C ${o.x} ${o.y}, ${o.x} ${o.y}, ${o.x} ${o.y}`;
            })
            .remove();

        // ===== 7. Convergence links (sum branch) =====
        const convergeLinks = [];

        // Deepest leaves → Mining totals
        miningTotalNodes.forEach(mt => {
            mt.leafSources.forEach((leaf, i) => {
                convergeLinks.push({
                    id: `conv-${mt.id}-${i}`,
                    source: { x: leaf.x, y: leaf.y + getNodeSize(leaf).height },
                    target: { x: mt.x, y: mt.y }
                });
            });
        });

        // Mining totals → Zone totals
        zoneTotalNodes.forEach(zt => {
            if (zt.childMiningTotals.length === 0) {
                convergeLinks.push({
                    id: 'conv-' + zt.id,
                    source: { x: zt.parentZone.x, y: zt.parentZone.y + getNodeSize(zt.parentZone).height },
                    target: { x: zt.x, y: zt.y }
                });
            } else {
                zt.childMiningTotals.forEach((mt, i) => {
                    convergeLinks.push({
                        id: `conv-${zt.id}-${i}`,
                        source: { x: mt.x, y: mt.y + getNodeSize(mt).height },
                        target: { x: zt.x, y: zt.y }
                    });
                });
            }
        });

        // Zone totals → Region totals
        regionTotalNodes.forEach(rt => {
            if (rt.childZoneTotals.length === 0) {
                convergeLinks.push({
                    id: 'conv-' + rt.id,
                    source: { x: rt.parentRegion.x, y: rt.parentRegion.y + getNodeSize(rt.parentRegion).height },
                    target: { x: rt.x, y: rt.y }
                });
            } else {
                rt.childZoneTotals.forEach((zt, i) => {
                    convergeLinks.push({
                        id: `conv-${rt.id}-${i}`,
                        source: { x: zt.x, y: zt.y + getNodeSize(zt).height },
                        target: { x: rt.x, y: rt.y }
                    });
                });
            }
        });

        const convLink = g.selectAll('path.conv-link')
            .data(convergeLinks, d => d.id);

        const convEnter = convLink.enter().insert('path', 'g.node')
            .attr('class', 'conv-link')
            .attr('fill', 'none')
            .attr('stroke', '#94a3b8')
            .attr('stroke-width', 1.8)
            .attr('stroke-dasharray', '5 4')
            .attr('opacity', 0.85)
            .attr('d', d => {
                const o = { x: source.x0 ?? 0, y: source.y0 ?? 0 };
                return `M ${o.x} ${o.y} C ${o.x} ${o.y}, ${o.x} ${o.y}, ${o.x} ${o.y}`;
            });

        convEnter.merge(convLink).transition().duration(duration)
            .attr('d', d => {
                const sx = d.source.x, sy = d.source.y;
                const tx = d.target.x, ty = d.target.y;
                return `M ${sx} ${sy} C ${sx} ${(sy + ty) / 2}, ${tx} ${(sy + ty) / 2}, ${tx} ${ty}`;
            });

        convLink.exit().transition().duration(duration).style('opacity', 0).remove();

        // ===== 8. Store positions =====
        allNodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });
    }
</script>
</body>
